<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#241773" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Tunas Weekly Football Pool Pick 'Em: make your picks every week."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tunas Weekly Football Pool Pick 'Em" />
    <meta property="og:description" content="Make your picks every week." />
    <meta property="og:image" content="https://tunaspool.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Tunas Weekly Football Pool Pick 'Em</title>
    <script>
      // The saved Text size, applied before the first paint (src/lib/textSize.ts).
      try {
        var size = localStorage.getItem('tunas.textSize');
        if (size === 'large' || size === 'xlarge') document.documentElement.dataset.textSize = size;
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- A first paint that doesn't wait for the app: the Game Day backdrop and the pool's name,
         styled by the stylesheet alone. React replaces it as soon as it starts (D-084). -->
    <div id="root">
      <main class="bg-gameday min-h-screen px-4 pb-16 pt-8">
        <div class="mx-auto flex max-w-player flex-col items-center gap-3 text-center">
          <p class="wordmark text-wordmark" aria-hidden="true">Tunas</p>
          <span class="ribbon text-xl">Weekly Football Pool</span>
          <p class="pt-6 text-body text-ink-inverse" role="status">Loading…</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
