name: CI
# A change to docs only (these paths and nothing else) runs nothing and deploys nothing (D-138).
# Any other file in the change, including the guide's pages in src/, runs everything as before.
# If `verify` is ever made a required check on main, docs-only PRs would wait for it forever:
# move this filter into the job then.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'
  pull_request:
    paths-ignore: # the same list
      - 'docs/**'
      - '.agents/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'

# A newer push to the same PR stops the older run. Each run on main is its own group, so none is
# ever cancelled or dropped while waiting (the deploy job queues on its own, below).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules
      # `npm run build` would typecheck again; the typecheck step above already did.
      - run: npx vite build
      # axe (WCAG 2.2 AA), brand fonts, and no horizontal scroll on /styleguide at 375px and desktop.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y

  # Production deploy. Runs only after `verify` passes on a push to main, never on pull requests.
  # Targets are pinned in firebase.json / .firebaserc (site tunaspool, database db-tunaspool).
  # Functions are deployed here too when they changed (D-041). Not deployed here: storage (the bucket
  # is shared with other apps, see docs/DECISIONS.md D-015).
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      FIREBASE_WEB_APP_ID: 1:793264910505:web:fcee5faedc9853eebdf9b8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so the functions step can see what this push changed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm ci
      - run: node scripts/write-web-env.mjs prod "$FIREBASE_WEB_APP_ID"
      # Team logos for the By game view (D-103), fetched fresh, never committed. Never blocks a
      # release: a logo that can't be fetched shows as the team badge.
      - run: npx tsx scripts/fetch-team-logos.ts
        continue-on-error: true
      # Only the Vite build: `verify` typechecked this same commit, so `npm run build` would repeat it.
      - run: npx vite build
      - run: npx firebase deploy --project prod --only hosting,firestore:rules,firestore:indexes --non-interactive --force

      # Functions follow the site, and only when this push changed them (DECISIONS.md D-041). Only the
      # tunaspool codebase is deployed, so other apps' functions in the shared project are never
      # touched. If the comparison fails for any reason, deploy: a needless deploy is harmless.
      - id: functions-changed
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- functions shared firebase.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The functions' predeploy builds them, so their dependencies are installed only when deploying.
      - if: steps.functions-changed.outputs.changed == 'true'
        run: npm --prefix functions ci
      - if: steps.functions-changed.outputs.changed == 'true'
        run: npx firebase deploy --project prod --only functions:tunaspool --non-interactive --force
